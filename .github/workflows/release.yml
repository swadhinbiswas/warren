name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Prepare assets
        run: |
          mkdir -p release_dir
          cp target/x86_64-unknown-linux-gnu/release/warren release_dir/warren
          tar -czf warren-linux-x86_64.tar.gz -C release_dir warren
          rm release_dir/warren
          cp target/aarch64-unknown-linux-gnu/release/warren release_dir/warren
          tar -czf warren-linux-aarch64.tar.gz -C release_dir warren

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            warren-linux-x86_64.tar.gz
            warren-linux-aarch64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to crates.io
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.RUST_TOKEN }}
